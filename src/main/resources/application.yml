server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: raizes-nordeste-gestao
  datasource:
    url: jdbc:h2:file:./data/raizes_nordeste_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false

# Configurações de Segurança e JWT
# A chave JWT deve ser definida via variável de ambiente APP_JWT_SECRET.
# Nunca publicar a chave secreta no repositório.
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000 # 24 horas em milissegundos
    issuer: raizes-nordeste-api
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:}
  autor:
    nome: "Rafael Inácio da Silva"
    ru: "4736098"
    instituicao: "Centro Universitário Internacional UNINTER"
    ano: 2026

# Documentação OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none

---
# Perfil de desenvolvimento: habilita somente o H2 Console local.
# APP_JWT_SECRET continua obrigatória também neste perfil.
spring:
  config:
    activate:
      on-profile: dev
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: false

app:
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
